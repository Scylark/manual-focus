"20" font-weight="400" fill="#1A1612" text-anchor="start">Bike shop fitting</text><text x="990" y="369" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Spring</text><rect x="530" y="400" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#E7DECF"/><text x="550" y="433" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1A1612" text-anchor="start">Clocks go back</text><text x="740" y="433" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Outdoor, video, email</text><text x="990" y="433" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Late October</text><text x="530" y="500" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="start">Paid media sends the right riders to the website and email</text><text x="530" y="525" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="start">list. Reviews and press make them believe it.</text></g></svg>

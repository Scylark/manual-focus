<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 846" width="820" height="846" role="img" aria-labelledby="market-t"><title id="market-t">Narrowing from everyone who buys helmets to the market a new helmet can win, and the alternatives it competes with</title><defs><marker id="market-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="844" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 1 · PRODUCT-MARKET FIT</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">IS THERE A MARKET YOU CAN</text><text x="48" y="160" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">WIN?</text><g transform="translate(0 48)"><rect x="40" y="170" width="740" height="100" rx="14" fill="#E2EEEA"/><text x="410" y="214" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">RIDERS WHO BUY HELMETS</text><text x="410" y="248" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="middle">The category exists. That alone proves nothing.</text><rect x="76" y="286" width="668" height="100" rx="14" fill="#F7EBD6"/><text x="410" y="330" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">BADLY SERVED BY WHAT THEY WEAR NOW</text><text x="410" y="364" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="middle">A need the current choices miss.</text><rect x="112" y="402" width="596" height="100" rx="14" fill="#F6E3D9"/><text x="410" y="446" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">WOULD SWITCH AT THE PRICE WE NEED</text><text x="410" y="480" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="middle">Enough of them, at a margin that works.</text><rect x="148" y="518" width="524" height="76" rx="14" fill="#C45A2C"/><text x="410" y="567" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">THE MARKET YOU CAN WIN</text><text x="48" y="638" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">INSTEAD OF WHAT?</text><circle cx="60" cy="672" r="5" fill="#5F574A"/><text x="78" y="679" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Their current helmet plus a clip-on light</text><circle cx="60" cy="708" r="5" fill="#5F574A"/><text x="78" y="715" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Another brand’s helmet</text><circle cx="60" cy="744" r="5" fill="#5F574A"/><text x="78" y="751" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Not riding after dark at all</text></g></svg>

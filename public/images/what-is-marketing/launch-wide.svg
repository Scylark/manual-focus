<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 676" width="1200" height="676" role="img" aria-labelledby="launchw-t"><title id="launchw-t">Strategy, campaign, creative, PR and execution for the helmet launch, each serving the layer above</title><defs><marker id="launchw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="674" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 7 · CAMPAIGN, CREATIVE AND PR</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">THE LAUNCH, LAYER BY LAYER</text><g transform="translate(0 0)"><rect x="40" y="160" width="1120" height="80" rx="12" fill="#C45A2C"/><text x="64" y="196" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">STRATEGY</text><text x="64" y="222" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#FCE6DA" text-anchor="start">Who we serve and why us</text><text x="480" y="208" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#fff" text-anchor="start">Year-round riders, the helmet for riding all year</text><rect x="56" y="252" width="1088" height="80" rx="12" fill="#D89B3F"/><text x="80" y="288" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">CAMPAIGN</text><text x="80" y="314" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="start">A time-bound push with its own objective</text><text x="480" y="300" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Winter launch, new customers by spring</text><rect x="72" y="344" width="1056" height="80" rx="12" fill="#F7EBD6"/><text x="96" y="380" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">CREATIVE</text><text x="96" y="406" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="start">The idea people see and hear</text><text x="480" y="392" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">From the top rung, getting home on dark evenings</text><rect x="88" y="436" width="1024" height="80" rx="12" fill="#E2EEEA"/><text x="112" y="472" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">PR AND REVIEWS</text><text x="112" y="498" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="start">Credibility you can’t buy</text><text x="480" y="484" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Trusted reviewers and riders, early</text><rect x="104" y="528" width="992" height="80" rx="12" fill="#7CA89A"/><text x="128" y="564" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">EXECUTION</text><text x="128" y="590" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="start">Delivery, on time and on brief</text><text x="480" y="576" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#1A1612" text-anchor="start">Photography, media, shop displays, emails</text><text x="48" y="642" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A8172" text-anchor="start">Each layer serves the one above. When a result disappoints, check from the bottom up.</text></g></svg>

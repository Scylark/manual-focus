<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1178" width="820" height="1178" role="img" aria-labelledby="chain-t"><title id="chain-t">The common thread of marketing in six steps, each mapped to its SOSTAC stage</title><defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="1176" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">THE COMMON THREAD</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">SIX STEPS, ONE CHAIN</text><g transform="translate(0 0)"><line x1="88" y1="240" x2="88" y2="1030" stroke="#E7DECF" stroke-width="4"/><rect x="40" y="170" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="240" r="26" fill="#C45A2C"/><text x="88" y="249" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="134" y="216" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT-MARKET FIT</text><text x="134" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Is there a market that wants this?</text><g transform="translate(134 266)"><rect x="0" y="0" width="123" height="35" rx="17.5" fill="#E2EEEA"/><text x="61.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="328" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="398" r="26" fill="#C45A2C"/><text x="88" y="407" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="134" y="374" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">MARKET RESEARCH</text><text x="134" y="408" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Who buys, why, and instead of what?</text><g transform="translate(134 424)"><rect x="0" y="0" width="123" height="35" rx="17.5" fill="#E2EEEA"/><text x="61.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="486" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="556" r="26" fill="#C45A2C"/><text x="88" y="565" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="134" y="532" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT REQUIREMENTS</text><text x="134" y="566" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">What must the product do for them?</text><g transform="translate(134 582)"><rect x="0" y="0" width="249" height="35" rx="17.5" fill="#E2EEEA"/><text x="124.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">OBJECTIVES · STRATEGY</text></g><rect x="40" y="644" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="714" r="26" fill="#C45A2C"/><text x="88" y="723" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="134" y="690" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">COMMUNICATION HIERARCHY</text><text x="134" y="724" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">What do we say first?</text><g transform="translate(134 740)"><rect x="0" y="0" width="112" height="35" rx="17.5" fill="#E2EEEA"/><text x="56" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">STRATEGY</text></g><rect x="40" y="802" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="872" r="26" fill="#C45A2C"/><text x="88" y="881" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="134" y="848" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">BENEFITS LADDER</text><text x="134" y="882" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Why will they care?</text><g transform="translate(134 898)"><rect x="0" y="0" width="102" height="35" rx="17.5" fill="#E2EEEA"/><text x="51" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">TACTICS</text></g><rect x="40" y="960" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="1030" r="26" fill="#7CA89A"/><text x="88" y="1039" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="134" y="1006" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">PLAN AND MEASURE</text><text x="134" y="1040" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Who does what, and is it working?</text><g transform="translate(134 1056)"><rect x="0" y="0" width="197" height="35" rx="17.5" fill="#E2EEEA"/><text x="98.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">ACTION · CONTROL</text></g><text x="48" y="1142" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A8172" text-anchor="start">The chip under each step is the SOSTAC stage it feeds.</text></g></svg>

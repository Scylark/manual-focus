<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 598" width="1200" height="598" role="img" aria-labelledby="ladderw-t"><title id="ladderw-t">The benefits ladder for the helmet’s integrated rear light, from feature to benefit to emotional resonance</title><defs><marker id="ladderw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="596" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 5 · BENEFITS LADDER</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">CLIMB FROM FEATURE TO FEELING</text><g transform="translate(0 0)"><rect x="126" y="150" width="14" height="412" rx="7" fill="#E7DECF"/><rect x="780" y="150" width="14" height="412" rx="7" fill="#E7DECF"/><rect x="140" y="160" width="640" height="112" rx="12" fill="#C45A2C"/><text x="162" y="192" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="2.5">EMOTIONAL RESONANCE</text><text x="162" y="224" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">YOU GET HOME, AND NOBODY AT HOME HAS</text><text x="162" y="252" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#fff" text-anchor="start">TO WORRY</text><rect x="140" y="296" width="640" height="112" rx="12" fill="#D89B3F"/><text x="162" y="328" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#1A1612" text-anchor="start" letter-spacing="2.5">BENEFIT</text><text x="162" y="360" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">DRIVERS SEE YOU ON DARK EVENINGS</text><rect x="140" y="432" width="640" height="112" rx="12" fill="#7CA89A"/><text x="162" y="464" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#1A1612" text-anchor="start" letter-spacing="2.5">FEATURE</text><text x="162" y="496" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="start">INTEGRATED REAR LIGHT</text><line x1="76" y1="528" x2="76" y2="174" stroke="#5F574A" stroke-width="3" marker-end="url(#ladderw-arrow)"/><text transform="translate(56 364) rotate(-90)" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="14" fill="#5F574A" text-anchor="middle" letter-spacing="2">WHY DOES THAT MATTER?</text><text x="842" y="180" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">HOW TO USE IT</text><text x="842" y="222" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Research climbs the ladder by</text><text x="842" y="248" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">asking why that matters to</text><text x="842" y="274" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">you.</text><text x="842" y="318" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Copy leads with the top rung,</text><text x="842" y="344" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">because that is what people</text><text x="842" y="370" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">remember.</text><text x="842" y="414" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">The feature at the bottom</text><text x="842" y="440" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">proves it. A line you can’t</text><text x="842" y="466" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">climb down from doesn’t</text><text x="842" y="492" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">belong in the launch.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 584" width="1200" height="584" role="img" aria-labelledby="marketw-t"><title id="marketw-t">Narrowing from everyone who buys helmets to the market a new helmet can win, and the alternatives it competes with</title><defs><marker id="marketw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="582" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 1 · PRODUCT-MARKET FIT</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">IS THERE A MARKET YOU CAN WIN?</text><g transform="translate(0 0)"><rect x="40" y="160" width="740" height="92" rx="14" fill="#E2EEEA"/><text x="410" y="200" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">RIDERS WHO BUY HELMETS</text><text x="410" y="232" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="middle">The category exists. That alone proves nothing.</text><rect x="76" y="264" width="668" height="92" rx="14" fill="#F7EBD6"/><text x="410" y="304" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">BADLY SERVED BY WHAT THEY WEAR NOW</text><text x="410" y="336" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="middle">A need the current choices miss.</text><rect x="112" y="368" width="596" height="92" rx="14" fill="#F6E3D9"/><text x="410" y="408" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="25" font-weight="700" fill="#1A1612" text-anchor="middle">WOULD SWITCH AT THE PRICE WE NEED</text><text x="410" y="440" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="middle">Enough of them, at a margin that works.</text><rect x="148" y="472" width="524" height="72" rx="14" fill="#C45A2C"/><text x="410" y="518" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">THE MARKET YOU CAN WIN</text><text x="828" y="186" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">INSTEAD OF WHAT?</text><text x="828" y="224" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">The competition isn’t only</text><text x="828" y="250" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">other helmets. For a commuter</text><text x="828" y="276" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">it might be</text><circle cx="836" cy="303" r="5" fill="#C45A2C"/><text x="854" y="310" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Their current helmet plus a</text><text x="854" y="336" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">clip-on light</text><circle cx="836" cy="371" r="5" fill="#C45A2C"/><text x="854" y="378" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Another brand’s helmet</text><circle cx="836" cy="413" r="5" fill="#C45A2C"/><text x="854" y="420" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Not riding after dark at all</text></g></svg>

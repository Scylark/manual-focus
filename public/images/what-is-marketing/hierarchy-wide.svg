<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="hierarchyw-t"><title id="hierarchyw-t">A communication hierarchy for the helmet, with one core message, three supporting messages and their proof, and how much of it each channel carries</title><defs><marker id="hierarchyw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="558" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 4 · COMMUNICATION HIERARCHY</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">ONE MESSAGE FIRST, THEN THE REST</text><g transform="translate(0 0)"><rect x="70" y="160" width="680" height="88" rx="14" fill="#C45A2C"/><text x="410" y="190" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#FCE6DA" text-anchor="middle" letter-spacing="2.5">CORE MESSAGE</text><text x="410" y="228" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="middle">THE HELMET FOR RIDING ALL YEAR</text><line x1="410" y1="248" x2="164" y2="280" stroke="#E7DECF" stroke-width="3"/><rect x="50" y="280" width="228" height="104" rx="12" fill="#F7EBD6"/><text x="164" y="308" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="14" font-weight="400" fill="#8A5A12" text-anchor="middle" letter-spacing="2">SUPPORTING</text><text x="164" y="338" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="22" font-weight
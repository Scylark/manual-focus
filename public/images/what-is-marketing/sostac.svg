<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 868" width="820" height="868" role="img" aria-labelledby="sostac-t"><title id="sostac-t">SOSTAC filled in for the helmet launch, with Control feeding back into the next Situation analysis</title><defs><marker id="sostac-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="866" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">BRINGING IT TOGETHER · PR SMITH’S SOSTAC</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">THE PLAN IS A LOOP</text><g transform="translate(0 0)"><rect x="140" y="166" width="640" height="96" rx="12" fill="#FFFFFF" stroke="#E7DECF"/><rect x="140" y="166" width="64" height="96" rx="12" fill="#7CA89A"/><text x="172" y="226" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="36" font-weight="700" fill="#fff" text-anchor="middle">S</text><text x="224" y="202" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">SITUATION</text><text x="760" y="200" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="17" font-weight="400" fill="#8A8172" text-anchor="end">Where are we now?</text><text x="224" y="238" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Product-market fit and the research findings</text><rect x="140" y="278" width="640" height="96" rx="12" fill="#FFFFFF" stroke="#E7DECF"/><rect
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 788" width="820" height="788" role="img" aria-labelledby="trace-t"><title id="trace-t">Each research finding becomes a requirement in the buyer’s words, and each requirement becomes a feature</title><defs><marker id="trace-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="786" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEPS 2 AND 3 · RESEARCH TO REQUIREMENTS</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">EVERY FEATURE TRACES BACK</text><g transform="translate(0 0)"><text x="48" y="172" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">FINDING</text><text x="306" y="172" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">REQUIREMENT</text><text x="564" y="172" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">FEATURE</text><rect x="48" y="194" width="218" height="138" rx="12" fill="#F7EBD6"/><text x="62" y="226" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Commuters want</text><text x="62" y="252" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">drivers to see</text><text x="62" y="278" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">them on dark</text><text x="62" y="304" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">evenings</text><line x1="270" y1="263" x2="300" y2="263" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="306" y="194" width="218" height="138" rx="12" fill="#E2EEEA"/><text x="320" y="226" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Visible from</text><text x="320" y="252" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">behind on an</text><text x="320" y="278" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">unlit road</text><line x1="528" y1="263" x2="558" y2="263" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="564" y="194" width="218" height="138" rx="12" fill="#F6E3D9"/><text x="578" y="226" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Integrated rear</text><text x="578" y="252" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">light</text><rect x="48" y="352" width="218" height="112" rx="12" fill="#F7EBD6"/><text x="62" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Road riders</text><text x="62" y="410" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">overheat on long</text><text x="62" y="436" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">summer climbs</text><line x1="270" y1="408" x2="300" y2="408" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="306" y="352" width="218" height="112" rx="12" fill="#E2EEEA"/><text x="320" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Stays cool on a</text><text x="320" y="410" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">long climb</text><line x1="528" y1="408" x2="558" y2="408" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="564" y="352" width="218" height="112" rx="12" fill="#F6E3D9"/><text x="578" y="384" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Larger vents and</text><text x="578" y="410" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">internal channels</text><rect x="48" y="484" width="218" height="164" rx="12" fill="#F7EBD6"/><text x="62" y="516" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Long-distance</text><text x="62" y="542" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">riders find</text><text x="62" y="568" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">helmets</text><text x="62" y="594" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">uncomfortable by</text><text x="62" y="620" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">the end</text><line x1="270" y1="566" x2="300" y2="566" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="306" y="484" width="218" height="164" rx="12" fill="#E2EEEA"/><text x="320" y="516" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Comfortable on a</text><text x="320" y="542" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">five-hour ride</text><line x1="528" y1="566" x2="558" y2="566" stroke="#5F574A" stroke-width="2.5" marker-end="url(#trace-arrow)"/><rect x="564" y="484" width="218" height="164" rx="12" fill="#F6E3D9"/><text x="578" y="516" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Adjustable fit</text><text x="578" y="542" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">system</text><text x="48" y="694" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Marketing writes the first two columns in the buyer’s words.</text><text x="48" y="720" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Engineering chooses the third. A feature with no finding behind it</text><text x="48" y="746" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">is a feature looking for a reason.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1350" width="820" height="1350" role="img" aria-labelledby="chain-t"><title id="chain-t">The whole job of marketing in eight steps, each mapped to its SOSTAC stage</title><defs><marker id="chain-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="1348" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">THE WHOLE JOB</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">EIGHT STEPS, ONE CHAIN</text><g transform="translate(0 0)"><line x1="88" y1="233" x2="88" y2="1213" stroke="#E7DECF" stroke-width="4"/><rect x="40" y="170" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="233" r="26" fill="#C45A2C"/><text x="88" y="242" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="134" y="210" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT-MARKET FIT</text><text x="134" y="242" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Is there a market that wants this?</text><g transform="translate(134 254)"><rect x="0" y="0" width="123" height="35" rx="17.5" fill="#E2EEEA"/><text x="61.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="310" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="373" r="26" fill="#C45A2C"/><text x="88" y="382" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="134" y="350" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">MARKET RESEARCH</text><text x="134" y="382" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Who buys, why, and instead of what?</text><g transform="translate(134 394)"><rect x="0" y="0" width="123" height="35" rx="17.5" fill="#E2EEEA"/><text x="61.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="450" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="513" r="26" fill="#C45A2C"/><text x="88" y="522" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="134" y="490" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT REQUIREMENTS</text><text x="134" y="522" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">What must the product do for them?</text><g transform="translate(134 534)"><rect x="0" y="0" width="249" height="35" rx="17.5" fill="#E2EEEA"/><text x="124.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">OBJECTIVES · STRATEGY</text></g><rect x="40" y="590" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="653" r="26" fill="#C45A2C"/><text x="88" y="662" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="134" y="630" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">COMMUNICATION HIERARCHY</text><text x="134" y="662" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">What do we say first?</text><g transform="translate(134 674)"><rect x="0" y="0" width="112" height="35" rx="17.5" fill="#E2EEEA"/><text x="56" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">STRATEGY</text></g><rect x="40" y="730" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="793" r="26" fill="#C45A2C"/><text x="88" y="802" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="134" y="770" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">BENEFITS LADDER</text><text x="134" y="802" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Why will they care?</text><g transform="translate(134 814)"><rect x="0" y="0" width="102" height="35" rx="17.5" fill="#E2EEEA"/><text x="51" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">TACTICS</text></g><rect x="40" y="870" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="933" r="26" fill="#7CA89A"/><text x="88" y="942" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="134" y="910" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">CHANNELS</text><text x="134" y="942" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Where and when do we say it?</text><g transform="translate(134 954)"><rect x="0" y="0" width="218" height="35" rx="17.5" fill="#E2EEEA"/><text x="109" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">STRATEGY · TACTICS</text></g><rect x="40" y="1010" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="1073" r="26" fill="#7CA89A"/><text x="88" y="1082" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="134" y="1050" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">CAMPAIGN, CREATIVE AND PR</text><text x="134" y="1082" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">How does the launch reach people?</text><g transform="translate(134 1094)"><rect x="0" y="0" width="197" height="35" rx="17.5" fill="#E2EEEA"/><text x="98.5" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">TACTICS · ACTION</text></g><rect x="40" y="1150" width="740" height="126" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="88" cy="1213" r="26" fill="#7CA89A"/><text x="88" y="1222" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="134" y="1190" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="30" font-weight="700" fill="#1A1612" text-anchor="start">MEASURE AND LEARN</text><text x="134" y="1222" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Is it working, and what changes?</text><g transform="translate(134 1234)"><rect x="0" y="0" width="102" height="35" rx="17.5" fill="#E2EEEA"/><text x="51" y="20" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="17" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">CONTROL</text></g><text x="48" y="1314" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A8172" text-anchor="start">Orange steps decide what you offer and say. Green steps take it to market.</text></g></svg>

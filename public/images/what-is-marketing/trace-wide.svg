<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="tracew-t"><title id="tracew-t">Each research finding becomes a requirement in the buyer’s words, and each requirement becomes a feature</title><defs><marker id="tracew-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="558" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEPS 2 AND 3 · RESEARCH TO REQUIREMENTS</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">EVERY FEATURE TRACES BACK</text><g transform="translate(0 0)"><text x="48" y="160" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">FINDING</text><text x="432" y="160" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">REQUIREMENT</text><text x="816" y="160" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">FEATURE</text><rect x="48" y="180" width="336" height="82" rx="12" fill="#F7EBD6"/><text x="62" y="210" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Commuters want drivers to see</text><text x="62" y="236" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">them on dark evenings</text><line x1="390" y1="221" x2="424" y2="221" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="432" y="180" width="336" height="82" rx="12" fill="#E2EEEA"/><text x="446" y="210" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Visible from behind on an</text><text x="446" y="236" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">unlit road</text><line x1="774" y1="221" x2="808" y2="221" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="816" y="180" width="336" height="82" rx="12" fill="#F6E3D9"/><text x="830" y="210" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Integrated rear light</text><rect x="48" y="278" width="336" height="82" rx="12" fill="#F7EBD6"/><text x="62" y="308" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Road riders overheat on long</text><text x="62" y="334" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">summer climbs</text><line x1="390" y1="319" x2="424" y2="319" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="432" y="278" width="336" height="82" rx="12" fill="#E2EEEA"/><text x="446" y="308" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Stays cool on a long climb</text><line x1="774" y1="319" x2="808" y2="319" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="816" y="278" width="336" height="82" rx="12" fill="#F6E3D9"/><text x="830" y="308" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Larger vents and internal</text><text x="830" y="334" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">channels</text><rect x="48" y="376" width="336" height="108" rx="12" fill="#F7EBD6"/><text x="62" y="406" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Long-distance riders find</text><text x="62" y="432" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">helmets uncomfortable by the</text><text x="62" y="458" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">end</text><line x1="390" y1="430" x2="424" y2="430" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="432" y="376" width="336" height="108" rx="12" fill="#E2EEEA"/><text x="446" y="406" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Comfortable on a five-hour</text><text x="446" y="432" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">ride</text><line x1="774" y1="430" x2="808" y2="430" stroke="#5F574A" stroke-width="2.5" marker-end="url(#tracew-arrow)"/><rect x="816" y="376" width="336" height="108" rx="12" fill="#F6E3D9"/><text x="830" y="406" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Adjustable fit system</text><text x="48" y="526" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="19" font-weight="400" fill="#5F574A" text-anchor="start">Marketing writes the first two columns in the buyer’s words. Engineering chooses the third.</text></g></svg>

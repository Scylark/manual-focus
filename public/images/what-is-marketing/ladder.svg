<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 796" width="820" height="796" role="img" aria-labelledby="ladder-t"><title id="ladder-t">The benefits ladder for the helmet’s integrated rear light, from feature to benefit to emotional resonance</title><defs><marker id="ladder-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="794" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 5 · BENEFITS LADDER</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">CLIMB FROM FEATURE TO</text><text x="48" y="160" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">FEELING</text><g transform="translate(0 48)"><rect x="196" y="158" width="14" height="470" rx="7" fill="#E7DECF"/><rect x="730" y="158" width="14" height="470" rx="7" fill="#E7DECF"/><rect x="210" y="168" width="520" height="122" rx="12" fill="#C45A2C"/><text x="232" y="200" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#fff" text-anchor="start" letter-spacing="2.5">EMOTIONAL RESONANCE</text><text x="232" y="236" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="start">YOU GET HOME, AND NOBODY AT</text><text x="232" y="264" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="start">HOME HAS TO WORRY</text><rect x="210" y="318" width="520" height="122" rx="12" fill="#D89B3F"/><text x="232" y="350" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#1A1612" text-anchor="start" letter-spacing="2.5">BENEFIT</text><text x="232" y="386" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">DRIVERS SEE YOU ON DARK</text><text x="232" y="414" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">EVENINGS</text><rect x="210" y="468" width="520" height="122" rx="12" fill="#7CA89A"/><text x="232" y="500" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#1A1612" text-anchor="start" letter-spacing="2.5">FEATURE</text><text x="232" y="536" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">INTEGRATED REAR LIGHT</text><line x1="120" y1="578" x2="120" y2="188" stroke="#5F574A" stroke-width="3" marker-end="url(#ladder-arrow)"/><text transform="translate(96 393) rotate(-90)" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" fill="#5F574A" text-anchor="middle" letter-spacing="2">WHY DOES THAT MATTER?</text><text x="48" y="648" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Research climbs the ladder by asking why that matters to you.</text><text x="48" y="675" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">Copy leads with the top rung, and the feature at the bottom</text><text x="48" y="702" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#5F574A" text-anchor="start">proves it.</text></g></svg>

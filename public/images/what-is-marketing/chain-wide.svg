<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 728" width="1200" height="728" role="img" aria-labelledby="chainw-t"><title id="chainw-t">The whole job of marketing in eight steps, each mapped to its SOSTAC stage</title><defs><marker id="chainw-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="1198" height="726" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">THE WHOLE JOB</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">EIGHT STEPS, ONE CHAIN</text><g transform="translate(0 0)"><rect x="40" y="160" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="86" cy="217" r="26" fill="#C45A2C"/><text x="86" y="226" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="132" y="198" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT-MARKET FIT</text><text x="132" y="228" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Is there a market that wants this?</text><g transform="translate(132 238)"><rect x="0" y="0" width="112" height="33" rx="16.5" fill="#E2EEEA"/><text x="56" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="288" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="86" cy="345" r="26" fill="#C45A2C"/><text x="86" y="354" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="132" y="326" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">MARKET RESEARCH</text><text x="132" y="356" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Who buys, why, and instead of what?</text><g transform="translate(132 366)"><rect x="0" y="0" width="112" height="33" rx="16.5" fill="#E2EEEA"/><text x="56" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">SITUATION</text></g><rect x="40" y="416" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="86" cy="473" r="26" fill="#C45A2C"/><text x="86" y="482" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="132" y="454" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">PRODUCT REQUIREMENTS</text><text x="132" y="484" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">What must the product do for them?</text><g transform="translate(132 494)"><rect x="0" y="0" width="223" height="33" rx="16.5" fill="#E2EEEA"/><text x="111.5" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">OBJECTIVES · STRATEGY</text></g><rect x="40" y="544" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="86" cy="601" r="26" fill="#C45A2C"/><text x="86" y="610" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="132" y="582" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">COMMUNICATION HIERARCHY</text><text x="132" y="612" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">What do we say first?</text><g transform="translate(132 622)"><rect x="0" y="0" width="102" height="33" rx="16.5" fill="#E2EEEA"/><text x="51" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">STRATEGY</text></g><rect x="616" y="160" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="662" cy="217" r="26" fill="#C45A2C"/><text x="662" y="226" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="708" y="198" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">BENEFITS LADDER</text><text x="708" y="228" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Why will they care?</text><g transform="translate(708 238)"><rect x="0" y="0" width="93" height="33" rx="16.5" fill="#E2EEEA"/><text x="46.5" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">TACTICS</text></g><rect x="616" y="288" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="662" cy="345" r="26" fill="#7CA89A"/><text x="662" y="354" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="708" y="326" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">CHANNELS</text><text x="708" y="356" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Where and when do we say it?</text><g transform="translate(708 366)"><rect x="0" y="0" width="195" height="33" rx="16.5" fill="#E2EEEA"/><text x="97.5" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">STRATEGY · TACTICS</text></g><rect x="616" y="416" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="662" cy="473" r="26" fill="#7CA89A"/><text x="662" y="482" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">7</text><text x="708" y="454" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">CAMPAIGN, CREATIVE AND PR</text><text x="708" y="484" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">How does the launch reach people?</text><g transform="translate(708 494)"><rect x="0" y="0" width="177" height="33" rx="16.5" fill="#E2EEEA"/><text x="88.5" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">TACTICS · ACTION</text></g><rect x="616" y="544" width="544" height="114" rx="14" fill="#FFFFFF" stroke="#E7DECF"/><circle cx="662" cy="601" r="26" fill="#7CA89A"/><text x="662" y="610" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">8</text><text x="708" y="582" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="27" font-weight="700" fill="#1A1612" text-anchor="start">MEASURE AND LEARN</text><text x="708" y="612" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#5F574A" text-anchor="start">Is it working, and what changes?</text><g transform="translate(708 622)"><rect x="0" y="0" width="93" height="33" rx="16.5" fill="#E2EEEA"/><text x="46.5" y="18" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="15" font-weight="400" fill="#3F6B5E" text-anchor="middle" letter-spacing="1">CONTROL</text></g><text x="48" y="694" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A8172" text-anchor="start">Orange steps decide what you offer and say. Green steps take it to market.</text></g></svg>

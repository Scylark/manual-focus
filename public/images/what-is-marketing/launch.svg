<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 806" width="820" height="806" role="img" aria-labelledby="launch-t"><title id="launch-t">Strategy, campaign, creative, PR and execution for the helmet launch, each serving the layer above</title><defs><marker id="launch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#5F574A"/></marker></defs><rect x="1" y="1" width="818" height="804" rx="22" fill="#FBF7F0" stroke="#E7DECF" stroke-width="2"/><text x="48" y="64" font-family="'SF Mono',Menlo,'JetBrains Mono',monospace" font-size="16" font-weight="400" fill="#C45A2C" text-anchor="start" letter-spacing="2.5">STEP 7 · CAMPAIGN, CREATIVE AND PR</text><text x="48" y="112" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="44" font-weight="700" fill="#1A1612" text-anchor="start">THE LAUNCH, LAYER BY LAYER</text><g transform="translate(0 0)"><rect x="40" y="168" width="740" height="102" rx="12" fill="#C45A2C"/><text x="64" y="206" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#fff" text-anchor="start">STRATEGY</text><text x="756" y="204" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#FCE6DA" text-anchor="end">Who we serve and why us</text><text x="64" y="244" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#fff" text-anchor="start">Year-round riders, the helmet for riding all year</text><rect x="54" y="284" width="712" height="102" rx="12" fill="#D89B3F"/><text x="78" y="322" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">CAMPAIGN</text><text x="742" y="320" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="end">A time-bound push with its own objective</text><text x="78" y="360" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Winter launch, new customers by spring</text><rect x="68" y="400" width="684" height="102" rx="12" fill="#F7EBD6"/><text x="92" y="438" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">CREATIVE</text><text x="728" y="436" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="end">The idea people see and hear</text><text x="92" y="476" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">From the top rung, getting home on dark evenings</text><rect x="82" y="516" width="656" height="102" rx="12" fill="#E2EEEA"/><text x="106" y="554" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">PR AND REVIEWS</text><text x="714" y="552" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="end">Credibility you can’t buy</text><text x="106" y="592" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Trusted reviewers and riders, early</text><rect x="96" y="632" width="628" height="102" rx="12" fill="#7CA89A"/><text x="120" y="670" font-family="'Arial Narrow','Archivo Narrow','Helvetica Neue Condensed',Arial,sans-serif" font-size="26" font-weight="700" fill="#1A1612" text-anchor="start">EXECUTION</text><text x="700" y="668" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="16" font-weight="400" fill="#5F574A" text-anchor="end">Delivery, on time and on brief</text><text x="120" y="708" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#1A1612" text-anchor="start">Photography, media, shop displays, emails</text><text x="48" y="770" font-family="Inter,'Helvetica Neue',Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#8A8172" text-anchor="start">Each layer serves the one above. When a result disappoints, check from the bottom up.</text></g></svg>
